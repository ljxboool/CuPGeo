[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cupgeo"
version = "0.2.0"
description = "Beyond Containment: Cup-Preserving Nested Geometry for Source-Only Cross-Domain Optic Disc and Cup Segmentation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jiaxiang Liang"}]
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "timm==1.0.28",
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6",
  "opencv-python-headless>=4.8",
  "scikit-learn>=1.3",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
hub = ["huggingface_hub>=1.0"]
analysis = ["scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["c3tta*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
