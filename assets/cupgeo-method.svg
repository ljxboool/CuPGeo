<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="445" viewBox="0 0 1600 445" role="img" aria-labelledby="title desc">
  <title id="title">CuPGeo — source-only cup and disc segmentation</title>
  <desc id="desc">Compact architecture flow. A frozen DINOv3 backbone with trainable LoRA and Pyramid-FPN produces shared features. The segmentation head and vertical region allocation refine cup probability. Cup-preserving composition completes disc probability with a residual rim; stop-gradient affects only the cup-to-disc training path. A shared threshold yields nested masks. A training-only soft-vCDR loss compares predicted and source-mask moment ratios. Blue denotes frozen modules, peach trainable modules, and green fixed geometry or objectives. Input and mask thumbnails are synthetic vector schematics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L7 4L1 7Z" fill="#242424" />
    </marker>
    <radialGradient id="fundus" cx=".65" cy=".44" r=".78">
      <stop offset="0" stop-color="#CF8136" />
      <stop offset="0.45" stop-color="#A75223" />
      <stop offset="1" stop-color="#53251D" />
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="445" fill="#FFFFFF" id="canvas" />
  <g font-family="Arial, Helvetica, sans-serif" text-rendering="optimizeLegibility">
    <path d="M160 20V36M160 28H261.0M435.0 28H536M529 24L536 28L529 32M536 20V36" fill="none" stroke="#C6CACF" stroke-width="1.5" />
    <text x="348.0" y="33" font-size="17" fill="#868B92" text-anchor="middle">Representation</text>
    <path d="M581 20V36M581 28H752.0M1016.0 28H1187M1180 24L1187 28L1180 32M1187 20V36" fill="none" stroke="#C6CACF" stroke-width="1.5" />
    <text x="884.0" y="33" font-size="17" fill="#868B92" text-anchor="middle">Cup-preserving geometry</text>
    <path d="M1240 20V36M1240 28H1343.0M1477.0 28H1580M1573 24L1580 28L1573 32M1580 20V36" fill="none" stroke="#C6CACF" stroke-width="1.5" />
    <text x="1410.0" y="33" font-size="17" fill="#868B92" text-anchor="middle">Prediction</text>
    <g id="input-thumbnail">
      <rect x="22" y="120" width="112" height="112" fill="#53251D" rx="2" />
      <rect x="23" y="121" width="110" height="110" fill="url(#fundus)" rx="2" />
      <path d="M102 163C74 144 50 147 29 132" fill="none" stroke="#713322" stroke-width="1.5" opacity=".8" />
      <path d="M98 174C69 174 48 181 26 202" fill="none" stroke="#713322" stroke-width="1.5" opacity=".8" />
      <path d="M99 178C87 195 75 211 64 231" fill="none" stroke="#713322" stroke-width="1.5" opacity=".8" />
      <path d="M105 164C115 148 116 130 129 124" fill="none" stroke="#713322" stroke-width="1.5" opacity=".8" />
      <path d="M106 180C112 198 122 212 132 224" fill="none" stroke="#713322" stroke-width="1.5" opacity=".8" />
      <path d="M67 151L60 130M59 180L43 164M86 198L107 220M71 181L57 200" fill="none" stroke="#713322" stroke-width="1.5" opacity=".8" />
      <ellipse cx="101" cy="171" rx="16" ry="21" fill="#DFA85B" opacity=".85" />
      <ellipse cx="101" cy="171" rx="7" ry="12" fill="#EDD090" opacity=".8" />
      <text x="78" y="258" font-size="19" fill="#B14A44" text-anchor="middle" font-style="italic">Input x</text>
    </g>
    <g id="shared-representation">
      <rect x="162" y="86" width="149" height="183" fill="#DFECF8" rx="10" />
      <text x="236.5" y="171.0" font-size="22" fill="#242424" text-anchor="middle" data-contrast="on-pastel">DINOv3</text>
      <text x="236.5" y="198.0" font-size="22" fill="#242424" text-anchor="middle" data-contrast="on-pastel">L/16</text>
      <rect x="324" y="86" width="40" height="183" fill="#FBE4D5" rx="7" />
      <text x="344" y="178" font-size="19" fill="#242424" text-anchor="middle" transform="rotate(-90 344 178)" data-contrast="on-pastel">LoRA</text>
      <rect x="399" y="86" width="137" height="183" fill="#FBE4D5" rx="10" />
      <text x="467.5" y="171.0" font-size="22" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Pyramid</text>
      <text x="467.5" y="198.0" font-size="22" fill="#242424" text-anchor="middle" data-contrast="on-pastel">FPN</text>
      <path d="M313 176H321" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
      <path d="M367 176H395" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="236" y="300" font-size="16" fill="#868B92" text-anchor="middle">frozen backbone</text>
      <text x="467" y="300" font-size="16" fill="#868B92" text-anchor="middle">shared features</text>
    </g>
    <path d="M136 176H158" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
    <g id="cup-geometry">
      <path d="M539 176H558V114H579" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
      <path d="M558 176V248H579" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
      <rect x="583" y="86" width="178" height="57" fill="#FBE4D5" rx="10" />
      <text x="672.0" y="121.5" font-size="22" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Seg. head</text>
      <rect x="583" y="220" width="178" height="56" fill="#FBE4D5" rx="10" />
      <text x="672.0" y="255.0" font-size="22" fill="#242424" text-anchor="middle" data-contrast="on-pastel">VRA</text>
      <path d="M672 146V216" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="687" y="185" font-size="19" fill="#B14A44" font-style="italic"><tspan>Z</tspan><tspan baseline-shift="sub" font-size="70%">C</tspan></text>
      <path d="M764 104H982V115H1001" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="879" y="93" font-size="19" fill="#B14A44" text-anchor="middle" font-style="italic"><tspan>Z</tspan><tspan baseline-shift="sub" font-size="70%">R</tspan></text>
      <path d="M764 130H788V174H810" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="788" y="158" font-size="18" fill="#B14A44" text-anchor="end" font-style="italic"><tspan>Z</tspan><tspan baseline-shift="sub" font-size="70%">C</tspan></text>
      <rect x="814" y="143" width="148" height="63" fill="#E2EFD9" rx="10" />
      <text x="888.0" y="168.0" font-size="19" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Cup refine</text>
      <text x="888.0" y="195.0" font-size="19" fill="#242424" text-anchor="middle" data-contrast="on-pastel"><tspan>σ(</tspan><tspan>Z</tspan><tspan baseline-shift="sub" font-size="70%">C</tspan><tspan> + B)</tspan></text>
      <path d="M764 248H888V210" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="792" y="236" font-size="19" fill="#B14A44" font-style="italic">B</text>
      <path d="M965 175H1001" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="983" y="163" font-size="18" fill="#B14A44" text-anchor="middle" font-style="italic"><tspan>P</tspan><tspan baseline-shift="sub" font-size="70%">C</tspan></text>
      <rect x="1005" y="86" width="182" height="190" fill="#E2EFD9" rx="10" />
      <text x="1096.0" y="174.5" font-size="20" fill="#242424" text-anchor="middle" data-contrast="on-pastel">CP</text>
      <text x="1096.0" y="201.5" font-size="20" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Cup + residual rim</text>
      <text x="1096" y="250" font-size="16" fill="#5F7156" text-anchor="middle">SG on disc path</text>
      <text x="672" y="302" font-size="16" fill="#868B92" text-anchor="middle">5-region vertical prior</text>
    </g>
    <g id="nested-prediction">
      <path d="M1190 176H1241" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="1216" y="159" font-size="17" fill="#B14A44" text-anchor="middle" font-style="italic"><tspan>P</tspan><tspan baseline-shift="sub" font-size="70%">C</tspan><tspan>, </tspan><tspan>P</tspan><tspan baseline-shift="sub" font-size="70%">D</tspan></text>
      <rect x="1245" y="119" width="132" height="114" fill="#E2EFD9" rx="10" />
      <text x="1311.0" y="169.5" font-size="21" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Threshold</text>
      <text x="1311.0" y="196.5" font-size="21" fill="#242424" text-anchor="middle" data-contrast="on-pastel">0.5</text>
      <path d="M1380 176H1435" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
      <rect x="1439" y="120" width="112" height="112" fill="#283238" rx="2" />
      <ellipse cx="1496" cy="176" rx="40" ry="46" fill="#B9C9CF" />
      <ellipse cx="1496" cy="175" rx="20" ry="29" fill="#F7FAFA" />
      <text x="1495" y="258" font-size="20" fill="#B14A44" text-anchor="middle">OC ⊆ OD</text>
    </g>
    <g id="training-objective">
      <rect x="786" y="326" width="246" height="46" fill="#E2EFD9" rx="10" />
      <text x="909.0" y="356.0" font-size="18" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Source-mask moments</text>
      <rect x="1078" y="326" width="252" height="46" fill="#E2EFD9" rx="10" />
      <text x="1204.0" y="356.0" font-size="18" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Soft-vCDR · Smooth L1</text>
      <path d="M1035 349H1074" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4" />
      <path d="M1217 179V322" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4" />
      <text x="1068" y="312" font-size="16" fill="#868B92" text-anchor="end" font-style="italic">Training only</text>
      <text x="1370" y="353" font-size="18" fill="#868B92">λ = 2.0</text>
    </g>
    <g id="method-legend">
      <rect x="16" y="398" width="1568" height="36" fill="#F5F5F5" rx="6" />
      <rect x="33" y="405" width="25" height="21" fill="#DFECF8" rx="3" />
      <text x="67" y="421" font-size="17" fill="#242424">frozen</text>
      <rect x="185" y="405" width="25" height="21" fill="#FBE4D5" rx="3" />
      <text x="219" y="421" font-size="17" fill="#242424">trainable</text>
      <rect x="365" y="405" width="25" height="21" fill="#E2EFD9" rx="3" />
      <text x="399" y="421" font-size="17" fill="#242424">geometry / objective</text>
      <path d="M650 416H688" fill="none" stroke="#242424" stroke-width="1.5" stroke-dasharray="5 4" />
      <text x="699" y="421" font-size="17" fill="#242424">training only</text>
      <text x="1570" y="421" font-size="20" fill="#242424" text-anchor="end" font-style="italic"><tspan>P</tspan><tspan baseline-shift="sub" font-size="70%">D</tspan><tspan> = </tspan><tspan>P</tspan><tspan baseline-shift="sub" font-size="70%">C</tspan><tspan> + (1 − </tspan><tspan>P</tspan><tspan baseline-shift="sub" font-size="70%">C</tspan><tspan>) ⊙ </tspan><tspan>P</tspan><tspan baseline-shift="sub" font-size="70%">R</tspan></text>
    </g>
  </g>
</svg>
