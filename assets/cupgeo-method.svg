<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="348" viewBox="0 0 1200 348" role="img" aria-labelledby="title desc">
  <title id="title">CuPGeo method overview</title>
  <desc id="desc">A restrained vector schematic of DINOv3 and Pyramid-FPN features, vertical region allocation, cup-preserving composition, and soft vertical cup-to-disc ratio supervision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#77919D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="346" rx="5" fill="#FFFFFF" stroke="#D9E2E7" stroke-width="2"/>
  <text x="32" y="42" fill="#203642" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">CuPGeo</text>
  <text x="1168" y="41" text-anchor="end" fill="#687E88" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.3">SOURCE-ONLY  ·  NESTED OD / OC</text>
  <line x1="32" y1="57" x2="1168" y2="57" stroke="#D9E2E7" stroke-width="1"/>

  <g fill="#FAFBFC" stroke="#D7E0E5" stroke-width="1.2">
    <rect x="30" y="78" width="251" height="220" rx="5"/>
    <rect x="326" y="78" width="251" height="220" rx="5"/>
    <rect x="622" y="78" width="251" height="220" rx="5"/>
    <rect x="918" y="78" width="251" height="220" rx="5"/>
  </g>
  <g fill="none" stroke="#77919D" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M286 188H317"/>
    <path d="M582 188H613"/>
    <path d="M878 188H909"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="49" y="106" fill="#4D7885" font-size="12" font-weight="700" letter-spacing="1">01  SHARED FEATURES</text>
    <text x="49" y="132" fill="#203642" font-size="18" font-weight="700">DINOv3-L/16 + FPN</text>
    <circle cx="112" cy="202" r="46" fill="none" stroke="#7896A0" stroke-width="2"/>
    <circle cx="112" cy="202" r="26" fill="none" stroke="#A6BCC3" stroke-width="1.6"/>
    <circle cx="112" cy="202" r="9" fill="none" stroke="#C58C71" stroke-width="2"/>
    <path d="M66 202H158M112 156V248" stroke="#C3D0D4" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="M178 166V238M194 177V238M210 159V238M226 184V238" stroke="#5F9CA6" stroke-width="5" stroke-linecap="round"/>
    <text x="49" y="276" fill="#667F89" font-size="13">Fundus image → multi-scale features</text>

    <text x="345" y="106" fill="#4D7885" font-size="12" font-weight="700" letter-spacing="1">02  VERTICAL ALLOCATION</text>
    <text x="345" y="132" fill="#203642" font-size="18" font-weight="700">Cup localization prior</text>
    <rect x="370" y="157" width="73" height="94" fill="#FFFFFF" stroke="#8EA7B0" stroke-width="1"/>
    <rect x="376" y="163" width="61" height="15" fill="#E8EFF1"/>
    <rect x="376" y="181" width="61" height="16" fill="#D2E3E6"/>
    <rect x="376" y="200" width="61" height="19" fill="#E5BAA5"/>
    <rect x="376" y="222" width="61" height="16" fill="#D2E3E6"/>
    <rect x="376" y="241" width="61" height="4" fill="#E8EFF1"/>
    <path d="M461 200H516M461 219H516M527 200V219M521 200H533M521 219H533" fill="none" stroke="#B37D62" stroke-width="1.5"/>
    <text x="455" y="185" fill="#788E97" font-size="12">five regions</text>
    <text x="345" y="276" fill="#667F89" font-size="13">Bounded correction to cup logits</text>

    <text x="641" y="106" fill="#4D7885" font-size="12" font-weight="700" letter-spacing="1">03  CUP-PRESERVING</text>
    <text x="641" y="132" fill="#203642" font-size="18" font-weight="700">Nested composition</text>
    <ellipse cx="747" cy="199" rx="62" ry="47" fill="none" stroke="#4F929D" stroke-width="2.4"/>
    <ellipse cx="747" cy="199" rx="26" ry="33" fill="none" stroke="#C58C71" stroke-width="2.4"/>
    <path d="M747 155V243" stroke="#BCCBD0" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="641" y="276" fill="#667F89" font-size="13">P(OD) ≥ P(OC), pixelwise</text>

    <text x="937" y="106" fill="#4D7885" font-size="12" font-weight="700" letter-spacing="1">04  RATIO SUPERVISION</text>
    <text x="937" y="132" fill="#203642" font-size="18" font-weight="700">Soft vCDR</text>
    <path d="M986 158V243M980 158H992M980 243H992" fill="none" stroke="#4F929D" stroke-width="2"/>
    <path d="M1038 175V226M1032 175H1044M1032 226H1044" fill="none" stroke="#C58C71" stroke-width="2"/>
    <text x="1058" y="208" fill="#35515D" font-size="16" font-weight="700">d<tspan baseline-shift="sub" font-size="11">cup</tspan> / d<tspan baseline-shift="sub" font-size="11">disc</tspan></text>
    <text x="937" y="276" fill="#667F89" font-size="13">Differentiable vertical geometry</text>

    <text x="600" y="326" text-anchor="middle" fill="#667F89" font-size="13">Source training with OD/OC masks and paired views  ·  Frozen prediction on unseen domains</text>
  </g>
</svg>
