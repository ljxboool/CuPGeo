<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="cupgeo-map-icon-title">
  <title id="cupgeo-map-icon-title">Repository structure</title>
  <style>
    .tile{fill:#F6F4EF;stroke:#E0E6DE;stroke-width:.65}
    .teal,.copper,.teal-line,.ink,.accent{stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .teal{fill:#E5EFEB;stroke:#337F80}
    .copper{fill:#F3DFCF;stroke:#A56849}
    .teal-line{fill:none;stroke:#337F80}
    .ink{fill:none;stroke:#173D43}
    .accent{fill:none;stroke:#A56849}
    @media (prefers-color-scheme:dark){
      .tile{fill:#1B2B2C;stroke:#415650}
      .teal{fill:#263F3C;stroke:#8ABDB2}
      .copper{fill:#48382E;stroke:#D9A27E}
      .teal-line{stroke:#8ABDB2}
      .ink{stroke:#D6E7DE}
      .accent{stroke:#D9A27E}
    }
  </style>
  <rect class="tile" x="1" y="1" width="22" height="22" rx="6"/>
  <path class="teal-line" d="M7 8v8.5c0 .8.7 1.5 1.5 1.5H15M7 11h8"/>
  <rect class="teal" x="4.5" y="4.5" width="5" height="4" rx="1.3"/>
  <rect class="teal" x="14.5" y="8.8" width="5" height="4.4" rx="1.3"/>
  <rect class="copper" x="14.5" y="15.8" width="5" height="4.4" rx="1.3"/>
</svg>
