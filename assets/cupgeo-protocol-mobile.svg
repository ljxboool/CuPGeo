    <text x="440" y="767" font-size="16" fill="#242424" text-anchor="end" data-contrast="on-pastel">19 images</text>
    <rect x="24" y="787" width="432" height="33" rx="6" fill="#E2EFD9" />
    <text x="40" y="810" font-size="18" fill="#242424" data-contrast="on-pastel">RIM-ONE DL</text>
