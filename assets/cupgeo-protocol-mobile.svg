    <text x="40" y="853" font-size="18" fill="#242424" data-contrast="on-pastel">PAPILA</text>
    <text x="440" y="853" font-size="16" fill="#242424" text-anchor="end" data-contrast="on-pastel">84 images</text>
    <text x="240" y="893" font-size="16" fill="#868B92" text-anchor="middle">Targets used for evaluation only</text>
    <rect x="16" y="916" width="448" height="108" rx="6" fill="#F5F5F5" />
    <text x="35" y="945" font-size="18" fill="#242424">Seeds 0, 1, 2</text>
    <text x="35" y="975" font-size="17" fill="#242424">Equal four-domain mean within each seed</text>
    <text x="35" y="1004" font-size="17" fill="#242424">→ Mean ± sample SD across seeds</text>
  </g>
</svg>
