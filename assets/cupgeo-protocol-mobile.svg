<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1040" viewBox="0 0 480 1040" role="img" aria-labelledby="title desc">
  <title id="title">CuPGeo — matched experimental protocol, portrait layout</title>
  <desc id="desc">REFUGE supplies 320 training images and 80 source-validation images. For each of seeds 0, 1, and 2, CP is pretrained for 120 epochs. Its best source-validation checkpoint independently initializes five 120-epoch continuations: CP only, Full CuPGeo, without ratio, without VRA, and without stop-gradient. Source-validation Mean Dice selects checkpoints. Frozen models are evaluated on BinRushed, 39 images; Magrabia, 19; RIM-ONE DL, 174; and PAPILA, 84. Target data do not participate in training or model selection. Results are averaged equally across the four domains within each seed, then summarized as the mean and sample standard deviation across seeds.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#242424" />
    </marker>
    <marker id="stage-arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C6CACF" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="480" height="1040" fill="#FFFFFF" id="canvas" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="37" font-size="25" fill="#242424" font-weight="600">Matched experiments</text>
    <text x="456" y="35" font-size="17" fill="#868B92" text-anchor="end">240 epochs</text>
    <text x="240" y="78" font-size="16" fill="#868B92" text-anchor="middle">Source training</text>
