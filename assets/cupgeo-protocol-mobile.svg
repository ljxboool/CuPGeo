    <rect x="24" y="98" width="196" height="66" rx="9" fill="#DFECF8" />
    <text x="122.0" y="125.0" font-size="19" fill="#242424" text-anchor="middle" data-contrast="on-pastel">REFUGE</text>
    <text x="122.0" y="149.0" font-size="19" fill="#242424" text-anchor="middle" data-contrast="on-pastel">320 training images</text>
    <rect x="252" y="98" width="204" height="66" rx="9" fill="#FBE4D5" />
    <text x="354.0" y="125.0" font-size="19" fill="#242424" text-anchor="middle" data-contrast="on-pastel">CP pretraining</text>
    <text x="354.0" y="149.0" font-size="19" fill="#242424" text-anchor="middle" data-contrast="on-pastel">120 epochs</text>
    <path d="M223 131H248" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M354 168V203H50V449" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="240" y="194" font-size="16" fill="#868B92" text-anchor="middle">Same-seed source-selected CP best</text>
    <rect x="85" y="229" width="371" height="39" rx="7" fill="#FBE4D5" />
    <text x="101" y="255" font-size="18" fill="#242424" data-contrast="on-pastel" font-weight="400">CP only</text>
    <text x="440" y="254" font-size="16" fill="#242424" text-anchor="end" data-contrast="on-pastel">+120 epochs</text>
    <path d="M50 249H81" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="85" y="279" width="371" height="39" rx="7" fill="#FBE4D5" />
    <text x="101" y="305" font-size="18" fill="#242424" data-contrast="on-pastel" font-weight="600">Full CuPGeo</text>
    <text x="440" y="304" font-size="16" fill="#242424" text-anchor="end" data-contrast="on-pastel">+120 epochs</text>
    <path d="M50 299H81" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="85" y="329" width="371" height="39" rx="7" fill="#FBE4D5" />
    <text x="101" y="355" font-size="18" fill="#242424" data-contrast="on-pastel" font-weight="400">w/o ratio</text>
    <text x="440" y="354" font-size="16" fill="#242424" text-anchor="end" data-contrast="on-pastel">+120 epochs</text>
    <path d="M50 349H81" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="85" y="379" width="371" height="39" rx="7" fill="#FBE4D5" />
