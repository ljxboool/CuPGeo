<linearGradient id="cp-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#EAF5EF"/><stop offset="1" stop-color="#CEE5D8"/></linearGradient>
<linearGradient id="ratio-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F1ECF8"/><stop offset="1" stop-color="#E3D8F0"/></linearGradient>
