    <rect x="30" y="226" width="184" height="58" rx="9" fill="#FBE4D5" />
    <text x="122.0" y="261.0" font-size="18" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Segmentation head</text>
    <rect x="266" y="226" width="184" height="58" rx="9" fill="#FBE4D5" />
    <text x="358.0" y="261.0" font-size="20" fill="#242424" text-anchor="middle" data-contrast="on-pastel">VRA</text>
    <path d="M217 253H262" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="239" y="243" font-size="16" fill="#B14A44" text-anchor="middle">Z<tspan baseline-shift="sub" font-size="70%">C</tspan></text>
    <path d="M124 288V368H141" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M358 288V368H339" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="116" y="326" font-size="18" fill="#B14A44" text-anchor="end">Z<tspan baseline-shift="sub" font-size="70%">C</tspan></text>
    <text x="371" y="326" font-size="18" fill="#B14A44">B</text>
