    <text x="24" y="661" font-size="16" fill="#868B92" font-style="italic">Training only</text>
    <rect x="24" y="680" width="192" height="56" rx="9" fill="#E2EFD9" />
    <text x="120.0" y="702.0" font-size="18" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Source-mask</text>
    <text x="120.0" y="726.0" font-size="18" fill="#242424" text-anchor="middle" data-contrast="on-pastel">moments</text>
    <rect x="250" y="680" width="206" height="56" rx="9" fill="#E2EFD9" />
    <text x="353.0" y="702.0" font-size="18" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Soft-vCDR</text>
    <text x="353.0" y="726.0" font-size="18" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Smooth L1 · λ = 2</text>
    <path d="M219 708H246" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4" />
    <text x="240" y="776" font-size="21" fill="#242424" text-anchor="middle" font-style="italic"><tspan>P</tspan><tspan baseline-shift="sub" font-size="70%">D</tspan><tspan> = </tspan><tspan>P</tspan><tspan baseline-shift="sub" font-size="70%">C</tspan><tspan> + (1 − </tspan><tspan>P</tspan><tspan baseline-shift="sub" font-size="70%">C</tspan><tspan>) ⊙ </tspan><tspan>P</tspan><tspan baseline-shift="sub" font-size="70%">R</tspan></text>
    <rect x="16" y="797" width="448" height="37" rx="6" fill="#F5F5F5" />
    <rect x="29" y="806" width="20" height="19" rx="3" fill="#DFECF8" />
    <text x="57" y="821" font-size="16" fill="#242424">frozen</text>
    <rect x="164" y="806" width="20" height="19" rx="3" fill="#FBE4D5" />
    <text x="192" y="821" font-size="16" fill="#242424">trainable</text>
    <rect x="320" y="806" width="20" height="19" rx="3" fill="#E2EFD9" />
    <text x="348" y="821" font-size="16" fill="#242424">geometry</text>
  </g>
</svg>
