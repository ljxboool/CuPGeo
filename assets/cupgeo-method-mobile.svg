    <rect x="245" y="98" width="74" height="60" rx="9" fill="#FBE4D5" />
    <text x="282.0" y="134.0" font-size="17" fill="#242424" text-anchor="middle" data-contrast="on-pastel">LoRA</text>
    <rect x="338" y="98" width="118" height="60" rx="9" fill="#FBE4D5" />
    <text x="397.0" y="134.0" font-size="16" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Pyramid-FPN</text>
    <path d="M228 128H241" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M321 128H334" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M397 161V189H124V222" fill="none" stroke="#242424" stroke-width="1.5" marker-end="url(#arrow)" />
