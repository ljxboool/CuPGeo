    <text x="240.0" y="362.0" font-size="19" fill="#242424" text-anchor="middle" data-contrast="on-pastel">Cup refine</text>
    <text x="240.0" y="386.0" font-size="19" fill="#242424" text-anchor="middle" data-contrast="on-pastel">σ(Z<tspan baseline-shift="sub" font-size="70%">C</tspan> + B)</text>
