<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1810" viewBox="0 0 480 1810" role="img" aria-labelledby="title desc">
  <title id="title">CuPGeo method — portrait layout</title>
  <desc id="desc">Conceptual vector illustration. DINOv3 and Pyramid-FPN produce shared features. Five vertical regions provide bounded cup-logit refinement, followed by cup-preserving composition of nested disc and cup probabilities. Source training supervises the ratio of their second-moment vertical extents. Frozen inference is used on unseen domains. Shapes are schematic, not patient images or model predictions.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#152527" />
      <stop offset="1" stop-color="#101C20" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.75" y2="1">
      <stop stop-color="#213334" />
      <stop offset="1" stop-color="#1A2B2D" />
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F6FBF7" />
      <stop offset="0.52" stop-color="#B8D8CE" />
      <stop offset="1" stop-color="#7AACAC" />
    </linearGradient>
    <radialGradient id="disc" cx="35%" cy="28%" r="80%">
      <stop stop-color="#F1FAEE" />
      <stop offset="0.5" stop-color="#C4DFD1" />
      <stop offset="1" stop-color="#6FA8A0" />
    </radialGradient>
    <radialGradient id="cup" cx="34%" cy="24%" r="85%">
      <stop stop-color="#F4E2CD" />
      <stop offset="0.5" stop-color="#E4C2A3" />
      <stop offset="1" stop-color="#C29171" />
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#204C50" />
      <stop offset="1" stop-color="#15373D" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#BED7CC" />
      <stop offset="1" stop-color="#DAE9DF" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#719B95" stroke-opacity="0.12" stroke-width="0.7" />
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" markerWidth="7" markerHeight="7" refX="6" refY="4" orient="auto">
      <path d="M1 1L5.5 4L1 7" fill="none" stroke="#72938C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
    <clipPath id="prior">
      <rect x="452" y="253" width="104" height="156" rx="9" />
    </clipPath>
    <clipPath id="surface">
      <rect x="1" y="1" width="1198" height="736" rx="22" />
    </clipPath>
  </defs>
  <rect x="1" y="1" width="478" height="1808" rx="20" fill="url(#paper)" stroke="#354C47" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="37" font-size="12" fill="#A8C7BB" letter-spacing="1.6" font-weight="700">CuPGeo / METHOD OVERVIEW</text>
    <text x="28" y="72" font-size="30" fill="#E6EEE8" font-weight="700">Cup-preserving</text>
    <text x="28" y="106" font-size="30" fill="#E6EEE8" font-weight="700">nested geometry</text>
    <g transform="translate(28 130) scale(1.17777778) translate(-28 -148)">
      <g id="stage-shared" aria-label="Shared representation: frozen DINOv3-L/16 with rank-8 QKV LoRA in the last four blocks, followed by Pyramid-FPN.">
        <rect x="28" y="148" width="360" height="342" rx="16" fill="url(#card)" stroke="#3B514A" filter="url(#shadow)" />
        <text x="51" y="179" fill="#A7C3B6" font-size="11" font-weight="700" letter-spacing="1.5">01 / SHARED REPRESENTATION</text>
        <text x="51" y="212" fill="#E6EEE8" font-size="22" font-weight="700" letter-spacing="-0.4">DINOv3 + LoRA</text>
        <text x="51" y="233" fill="#AEC5B8" font-size="11.5">Frozen L/16 · QKV rank 8 · last 4 blocks</text>
        <ellipse cx="207" cy="388" rx="111" ry="13" fill="#061416" opacity="0.58" />
        <g stroke-linejoin="round" filter="url(#lift)">
          <path d="M88 338L199 301L319 350L203 393Z" fill="#D7E6DB" stroke="#93B6AA" />
          <path d="M88 338V347L203 402V393Z" fill="#B2CCC0" stroke="#93B6AA" />
          <path d="M203 393L319 350V359L203 402Z" fill="#99BCB0" stroke="#93B6AA" />
          <path d="M88 311L199 274L319 323L203 366Z" fill="#C7DED1" stroke="#85AEA2" />
          <path d="M88 311V319L203 374V366Z" fill="#A8CABC" stroke="#85AEA2" />
          <path d="M203 366L319 323V331L203 374Z" fill="#8AB2A6" stroke="#85AEA2" />
          <path d="M88 284L199 247L319 296L203 339Z" fill="url(#plane)" stroke="#6B9E93" stroke-width="1.2" />
          <path d="M88 284V292L203 347V339Z" fill="#B4D1C1" stroke="#6B9E93" />
          <path d="M203 339L319 296V304L203 347Z" fill="#7FA99F" stroke="#6B9E93" />
          <g fill="none" stroke="#FFFFFF" stroke-opacity="0.58" stroke-width="0.8">
            <path d="M116 275L232 328M143 266L261 318M171 257L290 307M116 298L228 259M145 312L258 272M174 325L288 284" />
          </g>
          <path d="M170 281L197 272L226 284L199 294Z" fill="#EAC4A3" stroke="#C89B7B" />
          <path d="M199 294L226 284L255 297L228 307Z" fill="#DFB08B" stroke="#C89B7B" />
        </g>
        <path d="M77 251V399M72 251H82M72 399H82" fill="none" stroke="#A5BCB0" stroke-width="1" />
        <text x="207" y="435" text-anchor="middle" fill="#B6D1C0" font-size="14">Pyramid-FPN · multi-scale features</text>
        <path d="M51 452H365" fill="none" stroke="#3D5048" />
        <text x="51" y="474" fill="#ADC5B7" font-size="12.5">Shared anatomy and paired-view objectives</text>
      </g>
    </g>
    <g transform="translate(28 554) scale(1.17777778) translate(-420 -148)">
      <g id="stage-vra" aria-label="Vertical region allocation: five ordered vertical intervals generate a bounded refinement of cup logits.">
        <rect x="420" y="148" width="360" height="342" rx="16" fill="url(#card)" stroke="#3B514A" filter="url(#shadow)" />
        <text x="443" y="179" fill="#A7C3B6" font-size="11" font-weight="700" letter-spacing="1.5">02 / VERTICAL ALLOCATION · VRA</text>
        <text x="443" y="212" fill="#E6EEE8" font-size="22" font-weight="700" letter-spacing="-0.4">A prior for the cup</text>
        <text x="443" y="233" fill="#AEC5B8" font-size="11.5">An ordered prior · bounded logit refinement</text>
        <g clip-path="url(#prior)">
          <rect x="452" y="253" width="104" height="26" fill="#EEF1E9" />
          <rect x="452" y="279" width="104" height="31" fill="url(#rim)" />
          <rect x="452" y="310" width="104" height="48" fill="url(#cup)" />
          <rect x="452" y="358" width="104" height="29" fill="url(#rim)" />
          <rect x="452" y="387" width="104" height="22" fill="#EEF1E9" />
          <path d="M452 279H556M452 310H556M452 358H556M452 387H556" stroke="#FFFFFF" stroke-width="2" />
        </g>
        <rect x="452" y="253" width="104" height="156" rx="9" fill="none" stroke="#C0D2C5" />
        <g fill="#365F53" font-size="11" text-anchor="middle">
          <text x="504" y="270">outside</text>
          <text x="504" y="299">upper rim</text>
          <text x="504" y="338" fill="#76533A" font-size="13" font-weight="700">cup</text>
          <text x="504" y="377">lower rim</text>
          <text x="504" y="402">outside</text>
        </g>
        <path d="M568 331H594" fill="none" stroke="#72938C" stroke-width="1.5" marker-end="url(#arrow)" />
        <rect x="611" y="253" width="132" height="156" rx="10" fill="#EFF4EE" stroke="#D9E3D7" />
        <rect x="611" y="253" width="132" height="156" rx="10" fill="url(#grid)" opacity="0.65" />
        <path d="M653 281C679 263 711 287 713 323C718 363 692 393 667 380C642 368 635 309 653 281Z" fill="#E7D3B8" opacity="0.5" />
        <path d="M661 289C681 276 703 294 705 325C708 355 690 381 672 372C651 363 645 309 661 289Z" fill="url(#cup)" stroke="#BD8866" stroke-width="1.5" filter="url(#lift)" />
        <path d="M667 295C679 287 693 298 697 317" fill="none" stroke="#FFF6E9" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" />
        <path d="M603 310H751M603 358H751" stroke="#AE8C67" stroke-width="1" stroke-dasharray="3 5" opacity="0.55" />
        <text x="504" y="435" text-anchor="middle" fill="#B6D1C0" font-size="14">5 vertical regions</text>
        <text x="677" y="435" text-anchor="middle" fill="#B6D1C0" font-size="14">Refined cup logits</text>
        <path d="M443 452H757" fill="none" stroke="#3D5048" />
        <text x="443" y="474" fill="#ADC5B7" font-size="12.5">Bounded correction before composition</text>
      </g>
    </g>
    <g transform="translate(28 978) scale(1.17777778) translate(-812 -148)">
      <g id="stage-cp" aria-label="Cup-preserving composition: final disc probability is cup probability plus the conditional residual rim contribution.">
        <rect x="812" y="148" width="360" height="342" rx="16" fill="url(#card)" stroke="#3B514A" filter="url(#shadow)" />
        <text x="835" y="179" fill="#A7C3B6" font-size="11" font-weight="700" letter-spacing="1.5">03 / CUP-PRESERVING OUTPUT · CP</text>
        <text x="835" y="212" fill="#E6EEE8" font-size="22" font-weight="700" letter-spacing="-0.4">Nested by construction</text>
        <text x="835" y="233" fill="#AEC5B8" font-size="11.5">Cup + conditional residual rim</text>
        <ellipse cx="986" cy="400" rx="90" ry="10" fill="#061416" opacity="0.65" />
        <path d="M982 247C1034 244 1070 280 1077 325C1084 368 1052 405 1004 410C954 419 904 388 902 341C896 294 933 251 982 247Z" fill="url(#disc)" stroke="#538D82" stroke-width="1.7" filter="url(#lift)" />
        <path d="M984 257C1020 254 1051 278 1060 309" fill="none" stroke="#F4FBF1" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
        <path d="M981 279C1006 272 1027 297 1028 328C1031 360 1013 385 991 381C968 378 951 353 952 326C951 302 961 284 981 279Z" fill="url(#cup)" stroke="#BA835F" stroke-width="1.6" filter="url(#lift)" />
        <path d="M981 288C996 282 1011 297 1017 313" fill="none" stroke="#FFF5E3" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" />
        <path d="M990 247V421" stroke="#4A7568" stroke-width="0.9" stroke-dasharray="3 5" opacity="0.3" />
        <path d="M1074 287H1100" fill="none" stroke="#538D82" stroke-width="1.2" />
        <text x="1105" y="291" fill="#A6D2BF" font-size="12" font-weight="700">OD</text>
        <text x="990" y="335" text-anchor="middle" fill="#775338" font-size="13" font-weight="700">OC</text>
        <text x="992" y="435" text-anchor="middle" fill="#B6D1C0" font-size="14">Cup + residual rim → optic disc</text>
        <path d="M835 452H1149" fill="none" stroke="#3D5048" />
        <text x="835" y="474" fill="#ADC5B7" font-size="12.5">Threshold τ = 0.5 · nested OD / OC masks</text>
      </g>
    </g>
    <path d="M240 539v9" fill="none" stroke="#72938C" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M240 963v9" fill="none" stroke="#72938C" stroke-width="1.5" marker-end="url(#arrow)" />
    <rect x="28" y="1404" width="424" height="180" rx="16" fill="url(#ink)" stroke="#416A64" stroke-width="0.6" />
    <rect x="28" y="1604" width="424" height="164" rx="16" fill="url(#ink)" stroke="#416A64" stroke-width="0.6" />
    <g transform="translate(-246 888)">
      <text x="294" y="546" fill="#ADD0BE" font-size="10.5" font-weight="700" letter-spacing="1.5">SOURCE TRAINING / SOFT-vCDR</text>
      <text x="294" y="578" fill="#F7F8EF" font-size="22" font-weight="700">Second-moment vertical extent</text>
      <text x="294" y="613" fill="#F4E7D2" font-family="Georgia, 'Times New Roman', serif" font-size="25">r̃ = d̃<tspan baseline-shift="sub" font-size="15">C</tspan>
        <tspan baseline-shift="baseline"> / (d̃</tspan>
        <tspan baseline-shift="sub" font-size="15">D</tspan>
        <tspan baseline-shift="baseline"> + ε)</tspan>
      </text>
      <text x="294" y="649" fill="#B8CEC0" font-size="14">d̃(P) = 4√Var<tspan baseline-shift="sub" font-size="10">P</tspan>
        <tspan baseline-shift="baseline">(y) · supervision from source masks</tspan>
      </text>
      <text x="294" y="670" fill="#A9C5B7" font-size="10.5">Moments of the final OD / OC probability maps</text>
    </g>
    <g transform="translate(-735 1088)">
      <g id="forward-geometry" aria-label="Cup-preserving forward composition guarantees pixelwise disc probability at least equal to cup probability; stop-gradient blocks the direct disc-side gradient to the cup.">
        <text x="783" y="546" fill="#ADD0BE" font-size="10.5" font-weight="700" letter-spacing="1.5">FORWARD GEOMETRY / CP</text>
        <text x="783" y="591" fill="#F7F8EF" font-family="Georgia, 'Times New Roman', serif" font-size="25">P<tspan baseline-shift="sub" font-size="15">D</tspan>
          <tspan baseline-shift="baseline"> = P</tspan>
          <tspan baseline-shift="sub" font-size="15">C</tspan>
          <tspan baseline-shift="baseline"> + (1 − P</tspan>
          <tspan baseline-shift="sub" font-size="15">C</tspan>
          <tspan baseline-shift="baseline">) P</tspan>
          <tspan baseline-shift="sub" font-size="15">R</tspan>
        </text>
        <circle cx="790" cy="631" r="3" fill="#A6D3B7" />
        <text x="803" y="636" fill="#D6E5D7" font-size="15">P<tspan baseline-shift="sub" font-size="10">D</tspan>
          <tspan baseline-shift="baseline"> ≥ P</tspan>
          <tspan baseline-shift="sub" font-size="10">C</tspan>
          <tspan baseline-shift="baseline">, pixelwise · SG on the disc branch</tspan>
        </text>
        <text x="783" y="661" fill="#B8CEC0" font-size="11">P<tspan baseline-shift="sub" font-size="8">R</tspan>
          <tspan baseline-shift="baseline">: residual rim probability · SG: stop-gradient</tspan>
        </text>
      </g>
    </g>
    <text x="240" y="1793" font-size="14" fill="#B6CCBB" text-anchor="middle">Source training · frozen target inference</text>
  </g>
</svg>
