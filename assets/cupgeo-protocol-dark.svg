<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">CuPGeo — matched training and source-only model selection</title>
  <desc id="desc">REFUGE supplies 320 training images and 80 source-validation images. For each of seeds 0, 1, and 2, CP is pretrained for 120 epochs. Its best source-validation checkpoint independently initializes five 120-epoch continuations: CP only, Full CuPGeo, without ratio, without VRA, and without stop-gradient. Source-validation Mean Dice selects checkpoints. Frozen models are evaluated on BinRushed, 39 images; Magrabia, 19; RIM-ONE DL, 174; and PAPILA, 84. Target data do not participate in training or model selection. Results are averaged equally across the four domains within each seed, then summarized as the mean and sample standard deviation across seeds.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#E3E6EA" />
    </marker>
    <marker id="stage-arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="8" refY="5" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#59616C" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="1600" height="430" fill="#171A1F" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#E3E6EA">
    <g id="protocol-heading" fill="#A7AFBA" font-size="18" text-anchor="middle">
      <g fill="none" stroke="#59616C" stroke-width="1.5">
        <path d="M24 23V41M24 32H54M150 32H180M180 23V41" />
        <path d="M222 23V41M222 32H388M593 32H763" marker-end="url(#stage-arrow)" />
        <path d="M763 23V41M836 23V41M836 32H884M1071 32H1118" marker-end="url(#stage-arrow)" />
        <path d="M1118 23V41M1210 23V41M1210 32H1290M1500 32H1576" marker-end="url(#stage-arrow)" />
        <path d="M1576 23V41" />
      </g>
      <text x="102" y="38">Source</text>
      <text x="490" y="38">Matched training</text>
      <text x="977" y="38">Model selection</text>
      <text x="1394" y="38">Frozen evaluation</text>
      <text id="total-budget" x="490" y="62" font-size="14">240 EPOCHS</text>
    </g>
    <g id="protocol-source" text-anchor="middle">
      <rect x="24" y="147" width="156" height="108" rx="11" fill="#DFECF8" />
      <text x="102" y="178" font-size="21" data-contrast="on-pastel" fill="#242424">REFUGE</text>
      <text id="source-train-count" x="102" y="207" font-size="24" data-contrast="on-pastel" fill="#242424">320</text>
      <text x="102" y="235" font-size="17" data-contrast="on-pastel" fill="#242424">training images</text>
    </g>
    <g id="protocol-training">
      <g id="protocol-pretraining" text-anchor="middle">
        <rect x="222" y="147" width="200" height="108" rx="11" fill="#FBE4D5" />
        <text x="322" y="179" font-size="22" data-contrast="on-pastel" fill="#242424">CP pretraining</text>
        <text id="pretraining-budget" x="322" y="213" font-size="20" data-contrast="on-pastel" fill="#242424">120 epochs</text>
        <text x="322" y="239" font-size="16" fill="#242424" data-contrast="on-pastel">one checkpoint / seed</text>
        <text x="322" y="286" font-size="16" fill="#A7AFBA">Source-selected CP best</text>
      </g>
      <g id="protocol-continuations">
        <rect x="478" y="89" width="285" height="38" rx="8" fill="#FBE4D5" />
        <rect x="478" y="135" width="285" height="38" rx="8" fill="#FBE4D5" />
        <rect x="478" y="181" width="285" height="38" rx="8" fill="#FBE4D5" />
        <rect x="478" y="227" width="285" height="38" rx="8" fill="#FBE4D5" />
        <rect x="478" y="273" width="285" height="38" rx="8" fill="#FBE4D5" />
        <g id="branch-labels" font-size="19" text-anchor="middle">
