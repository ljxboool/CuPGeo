      <path d="M422 201H448M448 108V292" />
      <path d="M448 108H477" marker-end="url(#arrow)" />
      <path d="M448 154H477" marker-end="url(#arrow)" />
      <path d="M448 200H477" marker-end="url(#arrow)" />
      <path d="M448 246H477" marker-end="url(#arrow)" />
      <path d="M448 292H477" marker-end="url(#arrow)" />
      <path d="M763 108H793M763 154H793M763 200H793M763 246H793M763 292H793M793 108V292" />
      <path d="M793 201H835" marker-end="url(#arrow)" />
      <path d="M1118 201H1180M1180 123V279" />
      <path d="M1180 123H1209" marker-end="url(#arrow)" />
      <path d="M1180 175H1209" marker-end="url(#arrow)" />
      <path d="M1180 227H1209" marker-end="url(#arrow)" />
      <path d="M1180 279H1209" marker-end="url(#arrow)" />
    </g>
    <g id="protocol-reporting">
      <rect x="24" y="366" width="1552" height="47" rx="8" fill="#24282F" />
      <text x="44" y="396" font-size="17">Seeds:</text>
      <g id="seed-labels" font-size="17" text-anchor="middle">
        <text x="115" y="396">0</text>
        <text x="142" y="396">1</text>
        <text x="169" y="396">2</text>
      </g>
      <path d="M194 377V402M913 377V402" fill="none" stroke="#47505B" stroke-width="1.2" />
      <text x="215" y="396" font-size="17">Four-domain mean per seed</text>
      <path d="M459 390H503" fill="none" stroke="#E3E6EA" stroke-width="1.5" marker-end="url(#arrow)" />
      <text x="521" y="396" font-size="17">Mean ± sample SD across seeds</text>
      <text x="935" y="396" font-size="17">OD / OC / Mean Dice · hard vCDR MAE · CVR</text>
