          <text x="620.5" y="161" font-weight="700" data-contrast="on-pastel" fill="#242424">Full CuPGeo</text>
          <text x="620.5" y="207" data-contrast="on-pastel" fill="#242424">w/o ratio</text>
          <text x="620.5" y="253" data-contrast="on-pastel" fill="#242424">w/o VRA</text>
