      <rect x="1210" y="155" width="366" height="40" rx="8" fill="#DFECF8" />
      <rect x="1210" y="207" width="366" height="40" rx="8" fill="#DFECF8" />
      <rect x="1210" y="259" width="366" height="40" rx="8" fill="#DFECF8" />
      <g id="target-labels" font-size="19">
        <text x="1230" y="130" data-contrast="on-pastel" fill="#242424">BinRushed</text>
        <text x="1230" y="182" data-contrast="on-pastel" fill="#242424">Magrabia</text>
        <text x="1230" y="234" data-contrast="on-pastel" fill="#242424">RIM-ONE DL</text>
        <text x="1230" y="286" data-contrast="on-pastel" fill="#242424">PAPILA</text>
      </g>
      <g id="target-counts" font-size="18" text-anchor="end" fill="#A7AFBA">
        <text x="1555" y="130" data-contrast="on-pastel" fill="#242424">39</text>
        <text x="1555" y="182" data-contrast="on-pastel" fill="#242424">19</text>
        <text x="1555" y="234" data-contrast="on-pastel" fill="#242424">174</text>
        <text x="1555" y="286" data-contrast="on-pastel" fill="#242424">84</text>
      </g>
